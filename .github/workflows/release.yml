# Pubblica l'APK firmato in una Release di GitHub quando si crea un tag vX.Y.Z:
#   git tag v0.2.0 && git push origin v0.2.0
# La chiave di firma è nei secret del repo (copia di sicurezza fuori dal repo, vedi README).
name: Release app

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test e build firmata
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease -PappVersion="$version" --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/videocamera-segreta-$version.apk"

      - name: Verifica firma
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$RUNNER_TEMP"/videocamera-segreta-*.apk | grep -E "Signer|DN"
          "$apksigner" verify --print-certs "$RUNNER_TEMP"/videocamera-segreta-*.apk | grep -q "CN=videocamera-segreta"

      - name: Pubblica la release
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/videocamera-segreta-*.apk \
            --title "Videocamera segreta ${GITHUB_REF_NAME}" --generate-notes --latest
