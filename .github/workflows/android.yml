# Compila l'app e lancia test e lint a ogni modifica di android/. L'APK di debug resta come artifact del run.
name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint e build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - uses: actions/upload-artifact@v5
        with:
          name: videocamera-segreta-debug
          path: android/app/build/outputs/apk/debug/*.apk
